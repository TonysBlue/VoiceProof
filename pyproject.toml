[project]
name = "voiceproof"
version = "0.1.0"
description = "Offline, evidence-first QA for Chinese narration"
requires-python = ">=3.11,<3.13"

[project.scripts]
voiceproof = "voiceproof.cli:main"
voiceproof-web = "voiceproof.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project.optional-dependencies]
local = ["faster-whisper==1.2.1", "opencc-python-reimplemented==0.1.7"]

[tool.setuptools.package-data]
voiceproof = ["static/*.html", "static/*.js", "static/*.css"]

[tool.setuptools.packages.find]
include = ["voiceproof*"]
